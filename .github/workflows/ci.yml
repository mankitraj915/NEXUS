name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    name: Lint, Typecheck, Harness Verification & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff Lint Check (Repository-wide)
        run: uv run ruff check .

      - name: Mypy Type Check (Repository-wide)
        run: uv run mypy .

      - name: Benchmark Invariants Verification
        run: uv run python -m scripts.benchmark verify

      - name: Run Test Suite
        run: uv run pytest tests/ -v
