[project]
name = "nexus"
version = "0.1.0"
description = "Hybrid search engine combining custom BM25, dense retrieval (pgvector), and Reciprocal Rank Fusion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "greenlet",
    "beautifulsoup4",
    "httpx",
    "numpy",
    "onnxruntime",
    "pgvector",
    "tokenizers",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]
# Benchmark harness, torch baseline and the experimental modes; not installed for serving.
ml = [
    "nltk",  # baseline for the parity-analyzer gate
    "sentence-transformers",
    "openai>=3.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py312"
# Third-party code kept byte-for-byte apart from its imports; see its provenance header.
extend-exclude = ["app/domains/search/_vendor"]

[tool.ruff.lint]
ignore = [
    "B008",    # FastAPI Depends() idiom in endpoint function signatures
    "BLE001",  # Experimental modes catch Exception to fall back (planner) or skip a failed variant
    "S110",    # Handled cache loading exception pass
    "ASYNC230", # Allow standard file I/O in offline scripts and benchmark runners
]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
mypy_path = "."
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["app/domains/search/_vendor/"]

[[tool.mypy.overrides]]
module = "app.domains.search._vendor.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
